name: PhotoMind
options:
  bundleIdPrefix: com.yutubobo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
    ONLY_ACTIVE_ARCH: "NO"
    VALID_ARCHS: "arm64"
    ARCHS: "arm64"

targets:
  PhotoMind:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: AI相册
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - zh-Hans
          - en
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        NSPhotoLibraryUsageDescription: 需要读取相册才能在本机识别照片内容并让你用文字或语音搜索。照片不会离开这台设备。
        NSSpeechRecognitionUsageDescription: 用语音搜索照片时，语音优先在本机转成文字。
        NSMicrophoneUsageDescription: 按住说话需要临时使用麦克风。
        ITSAppUsesNonExemptEncryption: false
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yutubobo.photomind
        PRODUCT_NAME: PhotoMind
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: "NO"

schemes:
  PhotoMind:
    build:
      targets:
        PhotoMind: all
    run:
      config: Release
    archive:
      config: Release
